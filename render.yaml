services:
  - type: web
    name: nexus-ti
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: /var/data/nexus_ti.db
      - key: UPLOAD_FOLDER
        value: /var/data/uploads/chamados
      - key: COOKIE_SECURE
        value: "true"
    disk:
      name: nexus-ti-data
      mountPath: /var/data
      sizeGB: 1
