<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador | NEXUS TI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .admin-login { width: min(100%, 430px); background: #fff; padding: 34px; border-radius: 16px; box-shadow: 0 12px 40px #172b4d18; }
        .admin-login h1 { margin: 0 0 8px; }
        .admin-login p { color: #71819a; margin-bottom: 24px; }
        .admin-login .form-group { margin-bottom: 16px; }
        .admin-login input { width: 100%; box-sizing: border-box; }
        .admin-login button { width: 100%; border: 0; cursor: pointer; }
    </style>
</head>
<body>
    <main class="admin-login">
        <div class="form-heading">
            <div class="form-logo">N</div>
            <div><h1>NEXUS TI</h1><p>Área administrativa</p></div>
        </div>
        <h2>Entrar</h2>
        <p>Acesse com as credenciais administrativas configuradas no servidor.</p>
        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <div class="alerta {{ categoria }}">{{ mensagem }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <div class="form-group">
                <label for="usuario">Usuário</label>
                <input id="usuario" name="usuario" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input id="senha" name="senha" type="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-enviar">Entrar no NEXUS TI</button>
        </form>
    </main>
</body>
</html>
