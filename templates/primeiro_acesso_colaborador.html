<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Primeiro acesso | NEXUS TI</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="form-page"><section class="form-card"><div class="form-heading"><div class="form-logo">N</div><div><h1>NEXUS TI</h1><p>Ativação de colaborador</p></div></div><div class="form-title"><h2>Ative sua conta</h2><p>Informe o e-mail cadastrado e o código fornecido pelo administrador.</p></div>{% with mensagens=get_flashed_messages(with_categories=true) %}{% for categoria,mensagem in mensagens %}<div class="alerta {{ categoria }}">{{ mensagem }}</div>{% endfor %}{% endwith %}<form method="POST"><div class="form-group"><label>E-mail</label><input type="email" name="email" required></div><div class="form-group"><label>Código de primeiro acesso</label><input name="codigo" required></div><div class="form-group"><label>Crie uma senha (mínimo 8 caracteres)</label><input type="password" name="senha" minlength="8" required></div><div class="form-group"><label>Confirme a senha</label><input type="password" name="confirmar_senha" minlength="8" required></div><button class="btn-enviar" type="submit">Ativar conta</button></form><p style="margin-top:20px"><a href="{{ url_for('login_colaborador') }}">Voltar ao login</a></p></section></main></body></html>
